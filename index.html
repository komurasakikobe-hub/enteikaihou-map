const HOL=new Set(["2026-10-12","2026-11-03","2026-11-23","2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-22"]);
const W="日月火水木金土";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const lab=d=>`${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]})`;
// その日に開いている活動（日付発表済み＝その日付、定例＝曜日。定例は土日祝を除く）
function openOn(x,d){const k=ymd(d),iso=d.getDay()||7;return x.ev.filter(e=>e.d.length?e.d.includes(k):(e.w.includes(iso)&&!HOL.has(k)&&iso<=5));}
const today=new Date();today.setHours(0,0,0,0);const tmr=new Date(today);tmr.setDate(tmr.getDate()+1);
document.getElementById("l1").textContent="今日 "+lab(today);document.getElementById("l2").textContent="明日 "+lab(tmr);
DATA.forEach(x=>{x.t0=openOn(x,today);x.t1=openOn(x,tmr);x.c=x.t0.length?"red":x.t1.length?"yel":"gray";});
function listHtml(key,title){const a=DATA.filter(x=>x[key].length);return `<h2>${title}（${a.length}園）</h2>`+(a.length?a.map(x=>`<div class="row" data-id="${x.id}"><span class="dot" style="background:var(--${key=="t0"?"red":"yel"})"></span><div><span class="t">${x[key].map(e=>e.t).join(" / ")}</span> ${x.name}<br><small>${x[key].map(e=>e.n).join("・")}</small></div></div>`).join(""):'<div class="none">開いている園はありません</div>');}
document.getElementById("list").innerHTML=listHtml("t0","今日 "+lab(today))+listHtml("t1","明日 "+lab(tmr));
function initMap(){
  const map=new google.maps.Map(document.getElementById("map"),{center:{lat:34.7175,lng:135.268},zoom:15,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,clickableIcons:false,gestureHandling:"greedy",padding:{top:80,bottom:0}});
  const col={red:"#e53935",yel:"#f9a825",gray:"#9e9e9e"},iw=new google.maps.InfoWindow(),mk={};
  DATA.forEach(x=>{
    const m=new google.maps.Marker({map,position:{lat:x.lat,lng:x.lng},title:x.name,zIndex:x.c=="red"?3:x.c=="yel"?2:1,
      label:{text:String(x.id),color:"#fff",fontSize:"11px",fontWeight:"700"},
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:x.c=="gray"?10:13,fillColor:col[x.c],fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
    m.addListener("click",()=>{iw.setContent(`<div class="iw"><h3>${x.id}. ${x.name}</h3>${x.desc}${x.g?`<br><a href="${x.g}" target="_blank" rel="noopener">Googleマップで開く・道順</a>`:""}</div>`);iw.open({map,anchor:m});});
    mk[x.id]=m;});
  document.querySelectorAll(".row").forEach(r=>r.addEventListener("click",()=>{const m=mk[r.dataset.id];map.panTo(m.getPosition());google.maps.event.trigger(m,"click");}));
}
</script>
